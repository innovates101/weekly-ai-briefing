<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{SUBJECT}}</title>
  <style>
    /* ── Reset ── */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; }

    /* ── Base ── */
    body {
      margin: 0; padding: 0;
      background-color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a2e;
    }

    /* ── Wrapper ── */
    .wrapper { width: 100%; background-color: #f4f4f5; padding: 32px 0; }
    .container {
      max-width: 640px; margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* ── Header ── */
    .header { background-color: #0f172a; padding: 32px 40px 24px; }
    .header-eyebrow {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: #64748b; margin: 0 0 8px;
    }
    .header-title { font-size: 26px; font-weight: 700; color: #f8fafc; margin: 0 0 4px; }
    .header-meta { font-size: 13px; color: #94a3b8; margin: 0; }
    .header-accent {
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      margin-top: 20px;
    }

    /* ── TL;DR ── */
    .tldr {
      background-color: #f0f9ff;
      border-left: 4px solid #3b82f6;
      padding: 20px 40px;
    }
    .tldr-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #3b82f6; margin: 0 0 10px;
    }
    .tldr-list {
      margin: 0; padding: 0 0 0 18px;
      color: #1e3a5f; font-size: 14px; line-height: 1.8;
    }
    .tldr-list li { margin-bottom: 4px; }

    /* ── Section wrapper ── */
    .section { padding: 32px 40px 0; }
    .section-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: #6366f1; margin: 0 0 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }
    .section-gap { height: 8px; }

    /* ── Deep Dive ── */
    .deep-dive-title {
      font-size: 20px; font-weight: 700;
      color: #0f172a; margin: 0 0 20px;
      line-height: 1.35;
    }
    .deep-dive-content p {
      font-size: 15px; color: #334155;
      line-height: 1.75; margin: 0 0 14px;
    }
    .deep-dive-content h3 {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: #6366f1; margin: 24px 0 10px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
    }
    .deep-dive-content strong { color: #0f172a; }
    .deep-dive-content em { color: #475569; }
    .deep-dive-content a { color: #3b82f6; text-decoration: none; }
    .deep-dive-content a:hover { text-decoration: underline; }
    .deep-dive-content ul {
      margin: 0 0 14px; padding: 0 0 0 20px;
      font-size: 15px; color: #334155; line-height: 1.75;
    }

    /* ── Startup items ── */
    .startup-item { margin-bottom: 28px; }
    .startup-item:last-child { margin-bottom: 0; }
    .startup-header { display: flex; align-items: baseline; gap: 0; margin-bottom: 6px; }
    .startup-num {
      font-size: 12px; font-weight: 700; color: #6366f1;
      min-width: 24px; flex-shrink: 0;
    }
    .startup-name {
      font-size: 16px; font-weight: 700; color: #0f172a;
    }
    .startup-tagline {
      font-size: 15px; font-weight: 400; color: #64748b;
    }
    .startup-summary {
      font-size: 14px; color: #334155;
      line-height: 1.65; margin: 6px 0;
    }
    .startup-analysis {
      font-size: 13px; color: #475569;
      line-height: 1.6; margin: 8px 0 6px;
      padding: 10px 14px;
      background: #f8fafc;
      border-left: 3px solid #8b5cf6;
      border-radius: 0 4px 4px 0;
    }
    .startup-analysis strong { color: #1e40af; }
    .startup-source { font-size: 12px; color: #94a3b8; margin: 4px 0 0; }
    .startup-source a { color: #6366f1; text-decoration: none; }
    .startup-source a:hover { text-decoration: underline; }

    /* ── Things to Know items ── */
    .ttk-item { margin-bottom: 28px; }
    .ttk-item:last-child { margin-bottom: 0; }
    .ttk-headline {
      font-size: 15px; font-weight: 600;
      line-height: 1.4; margin: 0 0 3px;
    }
    .ttk-headline a { color: #0f172a; text-decoration: none; }
    .ttk-headline a:hover { text-decoration: underline; }
    .ttk-source { font-size: 12px; color: #94a3b8; margin: 0 0 8px; }
    .ttk-summary {
      font-size: 14px; color: #334155;
      line-height: 1.65; margin: 0 0 8px;
    }
    .ttk-bullet {
      font-size: 13px; color: #475569;
      line-height: 1.6; margin: 6px 0;
      padding: 8px 12px;
      background: #f8fafc;
      border-left: 3px solid #3b82f6;
      border-radius: 0 4px 4px 0;
    }
    .ttk-bullet strong { color: #1e40af; }

    /* ── Divider ── */
    .divider { height: 1px; background-color: #f1f5f9; margin: 20px 0; }

    /* ── Footer ── */
    .footer {
      padding: 28px 40px 36px;
      margin-top: 32px;
      border-top: 1px solid #e2e8f0;
      font-size: 12px; color: #94a3b8;
      text-align: center; line-height: 1.7;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="container">

    <!-- Header -->
    <div class="header">
      <p class="header-eyebrow">{{PUBLICATION_NAME}}</p>
      <h1 class="header-title">{{EDITION_TITLE}}</h1>
      <p class="header-meta">{{EDITION_DATE}} &nbsp;·&nbsp; {{AUDIENCE}}</p>
      <div class="header-accent"></div>
    </div>

    <!-- TL;DR -->
    <div class="tldr">
      <p class="tldr-label">TL;DR</p>
      <ul class="tldr-list">
        {{TLDR_ITEMS}}
      </ul>
    </div>

    <!-- Sections injected by email-builder.js -->
    {{SECTIONS}}

    <!-- Footer -->
    <div class="footer">
      <p>
        <strong>{{PUBLICATION_NAME}}</strong> &nbsp;·&nbsp; {{EDITION_DATE}}<br />
        Generated by Claude · Internal use only
      </p>
    </div>

  </div>
</div>
</body>
</html>
